<html>
<head>
	<meta charset="UTF-8">
	<title>Админка: Игроки</title>
	<link type="text/css" charset="utf-8" rel="stylesheet" href="css/bootstrap-5.min.css" />
	<script type="text/javascript" charset="utf-8" src="js/jquery-3.5.1.min.js"></script>
	<script type="text/javascript" charset="utf-8" src="js/bootstrap-5.min.js"></script>
	<link href="/fontawesome/css/all.css" rel="stylesheet">
	<script type="text/javascript" charset="utf-8" src="js/mainConfig.js"></script>
	<script src="js/vue.global.prod.js"></script>
</head>
<body>
	<h1>Команды:</h1>
	<div id="AdminApp">
		<a class="btn btn-lg btn-info" href="Admin.html" role="button" title="">Назад в админку</a>&nbsp;
		<a class="btn btn-lg btn-warning" href="AdminEvents.html" role="button" title="">Мероприятия</a>&nbsp;
		<a class="btn btn-lg btn-warning" href="AdminGameName.html" role="button" title="">Название и место матчей</a>&nbsp;
		<button class="btn btn-lg btn-secondary" type="button" @click="createTeamList">Создать команду</button>
		<br><br>
		<div class="container">
			<div class="row">
				<div class="col">
					<select  v-model="TeamSelected" @change="getTeam($event.target.value)" class="form-control" aria-label="Название команды">
						<option v-for="(row, Key) in this.TeamsList"  :value="Key">{{ row.Name }} ({{ row.Desc }}) - (Имя файла: {{ row.File }})</option>
					</select>
				</div>
			</div>
		</div>
		<div v-if="TeamSelected == 0">
			<h1 class="w-100 text-center text-danger">Выберите команду!</h1>
		</div>
		<div v-else>
			
			<div class="container">
				<div class="row">
					<div class="col">
						<h1>Команда: {{ Team.FullName }}</h1>
					</div>
				</div>
				<div class="row">
					<div class="col">
						<label class="form-label fw-bold">Короткое название: </label><input class="form-control" :value="Team.ShortName" @input="Team.ShortName = $event.target.value" />
					</div>
					<div class="col">
						<label class="form-label fw-bold">Подробное название: </label><input class="form-control" :value="Team.FullName" @input="Team.FullName = $event.target.value" />
					</div>
					<div class="col">
						<label class="form-label fw-bold">Откуда: </label><input class="form-control" :value="Team.Place" @input="Team.Place = $event.target.value" />
					</div>
				</div>
				<div class="row">
					<div class="col">
						<label class="form-label fw-bold pt-3">Логотип: </label>
						<select v-model="Team.Logo" class="form-control">
							<option v-for="option in LogoTeams" v-bind:value="option">{{ option }}</option>
						</select>
					</div>
					<div class="col">
						<label class="form-label fw-bold pt-3">Описание: </label><input class="form-control" :value="Team.Desc" @input="Team.Desc = $event.target.value" />
					</div>
					<div class="col">
						<label class="form-label fw-bold pt-3">Тренер: </label><input class="form-control" :value="Team.Trainer" @input="Team.Trainer = $event.target.value" />
					</div>
				</div>
				<div class="row">
					<div class="col">
						<label class="form-label fw-bold pt-3">Администратор: </label><input class="form-control" :value="Team.Administrator" @input="Team.Administrator = $event.target.value" />
					</div>
					<div class="col">
						<label class="form-label fw-bold pt-3">Руководитель: </label><input class="form-control" :value="Team.Boss" @input="Team.Boss = $event.target.value" />
					</div>
					<div class="col">
						<label class="form-label fw-bold pt-3">Средний возраст: </label><input class="form-control" :value="Team.MiddleLet" @input="Team.MiddleLet = $event.target.value" />
					</div>
				</div>
				<div class="row">
					<div class="col">
						
					</div>
				</div>
			</div>
			
			<div class="container-flow pt-3">
				<div class="row">
					<div class="col text-center">
						<button class="btn btn-success me-5" type="button" @click="saveTeamList">Сохранить</button>
						<button class="btn btn-danger" type="button" @click="deleteTeamList">Удалить</button>
					</div>
				</div>
			</div>
			
			<table class="table  table-striped w-100">
				<thead>
					<tr class="bg-gray-100" style="font-size: 1.7rem;">
						<th class="p-1 text-center" scope="col">Номер</th>
						<th class="p-1 text-center" scope="col">Статус</th>
						<th class="p-1 text-center" scope="col">Пятёрка</th>
						<th class="p-1 text-center" scope="col">ФИО <a href="https://www.artlebedev.ru/case/" target="_blank">--></a></th>
						<th class="p-1 text-center" scope="col">Фамилия И.О.</th>
						<th class="p-1 text-center" scope="col">Фотография</th>
						<th class="p-1 text-center" scope="col">Роль</th>
						<th class="p-1 text-center" scope="col">Позиция</th>
						<th class="p-1 text-center" scope="col"><button @click='addRow(-1)' :disabled=enableDisable ><i class="fa-solid fa-plus"></i></button></th>
						<th class="p-1 text-center" scope="col"></th>
					</tr>
				</thead>
				<tbody>
					<tr v-for="(row, index) in this.Team.Players">
						<td class="text-center"><input type="number" min="0" max="999" class="form-control w-100" :disabled=enableDisable :value="row.Key" @input="row.Key = $event.target.value" /></td>
						<td>
							<div class="text-center form-check form-switch">
								<input class="form-check-input" type="checkbox" v-model="row.Enable" :true-value="statusTrueValue" :false-value="statusFalseValue">
							</div>
						</td>
						<td class="text-center">
							<div class="text-center form-check form-switch">
								<input class="form-check-input" type="checkbox" v-model="row.Start5" :true-value="statusTrueValue" :false-value="statusFalseValue">
							</div>
						</td>
						<td class="text-center"><input class="form-control w-100" :disabled=enableDisable :value="row.FullName" @input="inputFullName(index,$event.target.value)" /></td>
						<td class="text-center"><input class="form-control w-100" :disabled=enableDisable :value="row.ShortName" @input="row.ShortName = $event.target.value" /></td>
						<td class="text-center">
							<select v-model="row.Photo" class="form-control">
								<option v-for="option in PhotoPlayers" v-bind:value="option">{{ option }}</option>
							</select>
						</td>
						<td class="text-center">
							<select v-model="row.Role" class="form-control" :disabled=enableDisable>
								<option v-for="option in role" :value="option.id" >
									{{ option.value }}
								</option>
							</select>
						</td>
						<td class="text-center">
							<select v-model="row.Position" class="form-control" :disabled=enableDisable>
								<option v-for="option in position" :value="option.id" >
									{{ option.value }}
								</option>
							</select>
						</td>
						<td class="text-center"><button @click='addRow(index)' :disabled=enableDisable ><i class="fa-solid fa-plus"></i></button></td>
						<td class="text-center"><button @click='removeRow(index)' :disabled=enableDisable ><i class="fa-solid fa-trash"></i></button></td>
					</tr>
				</tbody>
				<tfoot>
					<tr class="bg-gray-100" style="font-size: 1.7rem;">
						<th class="p-1 text-center" scope="col">Номер</th>
						<th class="p-1 text-center" scope="col">Статус</th>
						<th class="p-1 text-center" scope="col">Пятёрка</th>
						<th class="p-1 text-center" scope="col">ФИО</th>
						<th class="p-1 text-center" scope="col">Фамилия И.О.</th>
						<th class="p-1 text-center" scope="col">Фотография</th>
						<th class="p-1 text-center" scope="col">Роль</th>
						<th class="p-1 text-center" scope="col">Позиция</th>
						<th class="p-1 text-center" scope="col"><button @click='addRow()' :disabled=enableDisable ><i class="fa-solid fa-plus"></i></button></th>
						<th class="p-1 text-center" scope="col"></th>
					</tr>
				</tfoot>
			</table>
			<div class="container-flow mb-5">
				<div class="row">
					<div class="col text-center">
						<button class="btn btn-success me-5" type="button" @click="saveTeamList">Сохранить</button>
						<button class="btn btn-danger" type="button" @click="deleteTeamList">Удалить</button>
					</div>
				</div>
			</div>
		</div>
	</div>


	<script type="text/javascript" charset="utf-8" src="js/mainAdminTeamVue.js"></script>
</body>
</html>
