<html>
<head>
	<meta charset="UTF-8">
	<title>Админка: Создание</title>
	<link type="text/css" charset="utf-8" rel="stylesheet" href="css/bootstrap-5.min.css" />
	<script type="text/javascript" charset="utf-8" src="js/jquery-3.5.1.min.js"></script>
	<script type="text/javascript" charset="utf-8" src="js/bootstrap-5.min.js"></script>
	<script type="text/javascript" charset="utf-8" src="js/mainConfig.js"></script>
	<script src="js/vue.global.prod.js"></script>
</head>
<body>
	<h1>Название и места проведения матчей:</h1>
	<a class="btn btn-lg btn-info" href="Admin.html" role="button" title="">Назад в админку</a>&nbsp;
	<a class="btn btn-lg btn-warning" href="AdminEvents.html" role="button" title="">Мероприятия</a>&nbsp;
	<a class="btn btn-lg btn-warning" href="AdminTeams.html" role="button" title="">Команды</a>
	<br><br>
	<div id="AdminApp">
		<div class="container">
			<div class="row">
				<div class="col">
					<ul class="nav nav-tabs nav-justified" id="myTab" role="tablist">
						<li class="nav-item" role="presentation">
							<a class="nav-link active" id="GameName-tab" data-bs-toggle="tab" href="#GameName" role="tab" aria-controls="GameName" aria-selected="true">Название хоккейного матча</a>
						</li>
						<li class="nav-item" role="presentation">
							<a class="nav-link" id="GamePlace-tab" data-bs-toggle="tab" href="#GamePlace" role="tab" aria-controls="GamePlace" aria-selected="false">Место проведения матча</a>
						</li>
					</ul>
				</div>
			</div>
		</div>
		<div class="tab-content" id="myTabContent">
			<!--  +++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++  -->
			<div class="tab-pane fade show active" id="GameName" role="tabpanel" aria-labelledby="GameName-tab"><br>
				<div class="container">
					<div class="row">
						<div class="col">
							<button class="btn btn-secondary" type="button" @click="createGameName">Создать</button>
						</div>
					</div>
					<div class="row">
						<div class="col">
							<select  v-model="GameNameSelected" class="form-control" aria-label="Название матча">
								<option v-for="row in this.GameName"  :value="row.Key">{{ row.ShortName }} ({{ row.Desc }})</option>
							</select>
						</div>
					</div>
				</div>	
				
				<div v-if="GameNameSelected == 0">
					<h1 class="w-100 text-center text-danger">Выберите команду!</h1>
				</div>
				<div v-else>
					<div class="container mt-3">
						<div class="row">
							<div class="col">
								<button class="btn btn-secondary" type="button" @click="createGameName">Создать</button>
							</div>
						</div>
						<div class="row">
							<div class="col">
								<h1 class="text-center">{{ GameName[GameNameSelected].FullName }}</h1>								
							</div>
						</div>
						<div class="row">
							<div class="col">
								<label class="form-label fw-bold">Короткое название: </label><input class="form-control w-25" :value="GameName[GameNameSelected].ShortName" @input="GameName[GameNameSelected].ShortName = $event.target.value" />
							</div>
						</div>
						<div class="row">
							<div class="col">
								<label class="form-label fw-bold mt-3">Подробное название: </label><input class="form-control" :value="GameName[GameNameSelected].FullName" @input="GameName[GameNameSelected].FullName = $event.target.value" />
							</div>
						</div>
						<div class="row">
							<div class="col">
								<label class="form-label fw-bold mt-3">Описание: </label><input class="form-control" :value="GameName[GameNameSelected].Desc" @input="GameName[GameNameSelected].Desc = $event.target.value" />
							</div>
						</div>
						<div class="row">
							<div class="col">
								<button class="btn btn-success mt-3 me-5" type="button" @click="saveGameName">Сохранить</button>
								<button class="btn btn-danger mt-3" type="button" @click="deleteGameName">Удалить</button>
							</div>
						</div>
					</div>
				</div>
			</div>
			<!--  +++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++  -->
			<div class="tab-pane fade" id="GamePlace" role="tabpanel" aria-labelledby="GamePlace-tab"><br>
				<div class="container">
					<div class="row">
						<div class="col">
							<button class="btn btn-secondary" type="button" @click="createGamePlace">Создать</button>
						</div>
					</div>
					<div class="row">
						<div class="col">
							<select  v-model="GamePlaceSelected" class="form-control" aria-label="Название матча">
								<option v-for="row in this.GamePlace"  :value="row.Key">{{ row.ShortName }} ({{ row.Desc }})</option>
							</select>
						</div>
					</div>
				</div>	
				<div v-if="GamePlaceSelected == 0">
					<h1 class="w-100 text-center text-danger">Выберите команду!</h1>
				</div>
				<div v-else>
					<div class="container mt-3">
						<div class="row">
							<div class="col">
								<h1 class="text-center">{{ GamePlace[GamePlaceSelected].FullName }}</h1>								
							</div>
						</div>
						<div class="row">
							<div class="col">
								<label class="form-label fw-bold">Короткое название: </label><input class="form-control" :value="GamePlace[GamePlaceSelected].ShortName" @input="GamePlace[GamePlaceSelected].ShortName = $event.target.value" />
							</div>
						</div>
						<div class="row">
							<div class="col">
								<label class="form-label fw-bold">Подробное название: </label>
							</div>
						</div>
						<div class="row">
							<div class="col">
								<textarea rows="2" class="form-control" v-model="GamePlace[GamePlaceSelected].FullName" placeholder="введите несколько строчек" @input="GamePlace[GamePlaceSelected].FullName = $event.target.value"></textarea>
							</div>
						</div>
						<div class="row">
							<div class="col">
								<label class="form-label fw-bold">Город: </label><input class="form-control" :value="GamePlace[GamePlaceSelected].Place" @input="GamePlace[GamePlaceSelected].Place = $event.target.value" />
							</div>
						</div>
						<div class="row">
							<div class="col">
								<label class="form-label fw-bold">Описание: </label><input class="form-control" :value="GamePlace[GamePlaceSelected].Desc" @input="GamePlace[GamePlaceSelected].Desc = $event.target.value" />
							</div>
						</div>
						<div class="row">
							<div class="col">
								<button class="btn btn-success me-5" type="button" @click="saveGamePlace">Сохранить</button>
								<button class="btn btn-danger" type="button" @click="deleteGamePlace">Удалить</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script type="text/javascript" charset="utf-8" src="js/mainAdminGameNameAndPlaceVue.js"></script>
</body>
</html>
