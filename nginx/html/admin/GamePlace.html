<html>
<head>
	<meta charset="UTF-8">
	<title>Админка: Место проведения матчей</title>
	<link type="text/css" charset="utf-8" rel="stylesheet" href="/css/bootstrap.min.css" />
	<script type="text/javascript" charset="utf-8" src="/js/bootstrap.bundle.min.js"></script>
	<script type="text/javascript" charset="utf-8" src="/js/vue.global.prod.js"></script>
	<script type="text/javascript" charset="utf-8" src="/js/mainConfig.js"></script>
</head>
<body>
	<h1 class="text-center">Место проведения матчей:</h1>

	<div id="AdminApp">
		<div class="container">
			<div class="row mb-3">
				<div class="col">
					<div class="btn-group dropdown me-3">
						<button class="btn btn-lg btn-success dropdown-toggle" type="button" id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false">
							Разделы
						</button>
						<ul class="dropdown-menu" aria-labelledby="dropdownMenuButton1">
							<li class="bg-info"><a class="dropdown-item" href="/admin/"><--Назад в админку</a></li>
							<li class="bg-warning"><a class="dropdown-item" href="/admin/Events.html">1)Мероприятия</a></li>
							<li class="bg-warning"><a class="dropdown-item" href="/admin/Teams.html">2)Команды</a></li>
							<li class="bg-warning"><a class="dropdown-item" href="/admin/GameName.html">3)Название матчей</a></li>
							<li class="bg-success"><a class="dropdown-item text-white" href="/admin/GamePlace.html">4)Место проведения матчей</a></li>
							<li class="bg-warning"><a class="dropdown-item" href="/admin/Judge.html">5)Судьи</a></li>
							<li class="bg-warning"><a class="dropdown-item" href="/admin/Commentator.html">6)Комментаторы</a></li>
						</ul>
					</div>
					<div class="btn-group me-3">
						<button class="btn btn-lg btn-secondary" type="button" @click="createGamePlace">Создать</button>
					</div>
					<div class="btn-group me-3" v-if="GamePlaceSelected != 0">
						<button class="btn btn-lg btn-success" type="button" @click="saveGamePlace">Сохранить</button>
					</div>
					<div class="btn-group me-3" v-if="GamePlaceSelected != 0">
						<button class="btn btn-lg btn-danger" type="button" @click="deleteGamePlace">Удалить</button>
					</div>
				</div>
			</div>
		</div>
		<div v-if="connected == 0">
			<h1 class="w-100 text-center text-danger">Нет подключения</h1>
		</div>
		<div v-else>
			<div class="container">
				<div class="row">
					<div class="col">
						<select  v-model="GamePlaceSelected" class="form-control" aria-label="Название матча">
							<option v-for="row in this.GamePlace"  :value="row.Key">{{ row.ShortName }} ({{ row.Desc }})</option>
						</select>
					</div>
				</div>
			</div>
			<div v-if="GamePlaceSelected == 0">
				<h1 class="w-100 text-center text-danger">Выберите название матча!</h1>
			</div>
			<div v-else>
				<div class="container mt-3">
					<div class="row">
						<div class="col">
							<h1 class="text-center">{{ GamePlace[GamePlaceSelected].FullName }}</h1>								
						</div>
					</div>
					<div class="row">
						<div class="col">
							<label class="form-label fw-bold">Короткое название: </label><input class="form-control" :value="GamePlace[GamePlaceSelected].ShortName" @input="GamePlace[GamePlaceSelected].ShortName = $event.target.value" />
						</div>
					</div>
					<div class="row">
						<div class="col">
							<label class="form-label fw-bold">Подробное название: </label>
						</div>
					</div>
					<div class="row">
						<div class="col">
							<textarea rows="2" class="form-control" v-model="GamePlace[GamePlaceSelected].FullName" placeholder="введите несколько строчек" @input="GamePlace[GamePlaceSelected].FullName = $event.target.value"></textarea>
						</div>
					</div>
					<div class="row">
						<div class="col">
							<label class="form-label fw-bold">Город: </label><input class="form-control" :value="GamePlace[GamePlaceSelected].Place" @input="GamePlace[GamePlaceSelected].Place = $event.target.value" />
						</div>
					</div>
					<div class="row">
						<div class="col">
							<label class="form-label fw-bold">Описание: </label><input class="form-control" :value="GamePlace[GamePlaceSelected].Desc" @input="GamePlace[GamePlaceSelected].Desc = $event.target.value" />
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script type="text/javascript" charset="utf-8" src="/admin/js/GamePlace.js"></script>
</body>
</html>
