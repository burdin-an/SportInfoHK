<html>
<head>
	<meta charset="UTF-8">
	<title>Админка: Судейская бригада</title>
	<link type="text/css" charset="utf-8" rel="stylesheet" href="/css/bootstrap.min.css" />
	<script type="text/javascript" charset="utf-8" src="/js/bootstrap.bundle.min.js"></script>
	<script type="text/javascript" charset="utf-8" src="/js/vue.global.prod.js"></script>
	<script type="text/javascript" charset="utf-8" src="/js/mainConfig.js"></script>
</head>
<body>
	<h1 class="text-center">Судейская бригада:</h1>

	<div id="AdminApp">
		<div class="container">
			<div class="row mb-3">
				<div class="col">
					<div class="btn-group dropdown me-3">
						<button class="btn btn-lg btn-success dropdown-toggle" type="button" id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false">
							Разделы
						</button>
						<ul class="dropdown-menu" aria-labelledby="dropdownMenuButton1">
							<li class="bg-info"><a class="dropdown-item" href="/admin/"><--Назад в админку</a></li>
							<li class="bg-warning"><a class="dropdown-item" href="/admin/Events.html">1)Мероприятия</a></li>
							<li class="bg-warning"><a class="dropdown-item" href="/admin/Teams.html">2)Команды</a></li>
							<li class="bg-warning"><a class="dropdown-item" href="/admin/GameName.html">3)Название матчей</a></li>
							<li class="bg-warning"><a class="dropdown-item" href="/admin/GamePlace.html">4)Место проведения матчей</a></li>
							<li class="bg-success"><a class="dropdown-item text-white" href="AdminJudge.html">5)Судьи</a></li>
							<li class="bg-warning"><a class="dropdown-item" href="/admin/Commentator.html">6)Комментаторы</a></li>
						</ul>
					</div>
					<div class="btn-group me-3">
						<button class="btn btn-lg btn-secondary" type="button" @click="createJudge">Создать</button>
					</div>
					<div class="btn-group me-3" v-if="JudgeSelected != 0">
						<button class="btn btn-lg btn-success" type="button" @click="saveJudge">Сохранить</button>
					</div>
					<div class="btn-group me-3" v-if="JudgeSelected != 0">
						<button class="btn btn-lg btn-danger" type="button" @click="deleteJudge">Удалить</button>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col">
					<select  v-model="JudgeSelected" class="form-control" aria-label="Судьи">
						<option value="" disabled>Судьи</option>
						<option v-for="row in this.Judges"  :value="row.Key">{{ row.ShortName }} ({{ row.Desc }})</option>
					</select>
				</div>
			</div>
		</div>	
		<div v-if="connected == 0">
			<h1 class="w-100 text-center text-danger">Нет подключения</h1>
		</div>
		<div v-else>
			<div v-if="JudgeSelected == 0">
				<h1 class="w-100 text-center text-danger">Выберите судью!</h1>
			</div>
			<div v-else>
				<div class="container mt-3">
					<div class="row">
						<div class="col">
							<h1 class="text-center">{{ Judges[JudgeSelected].FullName }}</h1>								
						</div>
					</div>
					<div class="row">
						<div class="col">
							<label class="form-label fw-bold">Номер: </label><input class="form-control w-25" type="number" :value="Judges[JudgeSelected].Number" @input="Judges[JudgeSelected].Number = $event.target.value" />
						</div>
					</div>
					<div class="row">
						<div class="col">
							<label class="form-label fw-bold mt-3">ФИО (Полное): </label><input class="form-control" :value="Judges[JudgeSelected].FullName" @input="Judges[JudgeSelected].FullName = $event.target.value" />
						</div>
					</div>
					<div class="row">
						<div class="col">
							<label class="form-label fw-bold">Фамилия, инициалы (сокращённое): </label><input class="form-control w-25" :value="Judges[JudgeSelected].ShortName" @input="Judges[JudgeSelected].ShortName = $event.target.value" />
						</div>
					</div>
					<div class="row">
						<div class="col">
							<label class="form-label fw-bold">Фотография: </label>
							<select v-model="Judges[JudgeSelected].Photo" class="form-control">
								<option v-for="option in PhotoJudges" v-bind:value="option">{{ option }}</option>
							</select>
						</div>
					</div>
					<div class="row mb-5">
						<div class="col">
							<label class="form-label fw-bold mt-3">Описание: </label><input class="form-control" :value="Judges[JudgeSelected].Desc" @input="Judges[JudgeSelected].Desc = $event.target.value" />
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script type="text/javascript" charset="utf-8" src="/admin/js/Judge.js"></script>
</body>
</html>
