<html>
<head>
	<meta charset="UTF-8">
	<title>Админка: Комментаторы</title>
	<link type="text/css" charset="utf-8" rel="stylesheet" href="/css/bootstrap.min.css" />
	<script type="text/javascript" charset="utf-8" src="/js/bootstrap.bundle.min.js"></script>
	<script type="text/javascript" charset="utf-8" src="/js/vue.global.prod.js"></script>
	<script type="text/javascript" charset="utf-8" src="/js/mainConfig.js"></script>
</head>
<body>
	<h1 class="text-center">Комментаторы:</h1>

	<div id="AdminApp">
		<div class="container">
			<div class="row mb-3">
				<div class="col">
					<div class="btn-group dropdown me-3">
						<button class="btn btn-lg btn-success dropdown-toggle" type="button" id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false">
							Разделы
						</button>
						<ul class="dropdown-menu" aria-labelledby="dropdownMenuButton1">
							<li class="bg-info"><a class="dropdown-item" href="/admin/"><--Назад в админку</a></li>
							<li class="bg-warning"><a class="dropdown-item" href="/admin/Events.html">1)Мероприятия</a></li>
							<li class="bg-warning"><a class="dropdown-item" href="/admin/Teams.html">2)Команды</a></li>
							<li class="bg-warning"><a class="dropdown-item" href="/admin/GameName.html">3)Название матчей</a></li>
							<li class="bg-warning"><a class="dropdown-item" href="/admin/GamePlace.html">4)Место проведения матчей</a></li>
							<li class="bg-warning"><a class="dropdown-item" href="/admin/Judge.html">5)Судьи</a></li>
							<li class="bg-success"><a class="dropdown-item text-white" href="/admin/Commentator.html">6)Комментаторы</a></li>
						</ul>
					</div>
					<div class="btn-group me-3">
						<button class="btn btn-lg btn-secondary" type="button" @click="createCommentator">Создать</button>
					</div>
					<div class="btn-group me-3" v-if="CommentatorSelected != 0">
						<button class="btn btn-lg btn-success" type="button" @click="saveCommentator">Сохранить</button>
					</div>
					<div class="btn-group me-3" v-if="CommentatorSelected != 0">
						<button class="btn btn-lg btn-danger" type="button" @click="deleteCommentator">Удалить</button>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col">
					<select  v-model="CommentatorSelected" class="form-control" aria-label="Судьи">
						<option value="" disabled>Комментаторы</option>
						<option v-for="row in this.Commentators"  :value="row.Key">{{ row.ShortName }} ({{ row.Desc }})</option>
					</select>
				</div>
			</div>
		</div>	
		<div v-if="connected == 0">
			<h1 class="w-100 text-center text-danger">Нет подключения</h1>
		</div>
		<div v-else>
			<div v-if="CommentatorSelected == 0">
				<h1 class="w-100 text-center text-danger">Выберите комментатора!</h1>
			</div>
			<div v-else>
				<div class="container mt-3">
					<div class="row">
						<div class="col">
							<h1 class="text-center">{{ Commentators[CommentatorSelected].FullName }}</h1>								
						</div>
					</div>
					<div class="row">
						<div class="col">
							<label class="form-label fw-bold mt-3">ФИО (Полное): </label><input class="form-control" :value="Commentators[CommentatorSelected].FullName" @input="Commentators[CommentatorSelected].FullName = $event.target.value" />
						</div>
					</div>
					<div class="row">
						<div class="col">
							<label class="form-label fw-bold">Фамилия, инициалы (сокращённое): </label><input class="form-control w-25" :value="Commentators[CommentatorSelected].ShortName" @input="Commentators[CommentatorSelected].ShortName = $event.target.value" />
						</div>
					</div>
					<div class="row">
						<div class="col">
							<label class="form-label fw-bold">Фотография: </label>
							<select v-model="Commentators[CommentatorSelected].Photo" class="form-control">
								<option v-for="option in PhotoCommentators" v-bind:value="option">{{ option }}</option>
							</select>
						</div>
					</div>
					<div class="row">
						<div class="col">
							<label class="form-label fw-bold mt-3">Описание: </label><input class="form-control" :value="Commentators[CommentatorSelected].Desc" @input="Commentators[CommentatorSelected].Desc = $event.target.value" />
						</div>
					</div>
					<div class="row">
						<div class="col">
							<button class="btn btn-success mt-3 me-5" type="button" @click="saveCommentator">Сохранить</button>
							<button class="btn btn-danger mt-3" type="button" @click="deleteCommentator">Удалить</button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script type="text/javascript" charset="utf-8" src="/admin/js/Commentator.js"></script>
</body>
</html>
